# nx.js runtime configuration for RomMmate
# Tuned for stability on the Nintendo Switch

[v8]
# Disable JIT compilation — matches applet mode (jitless) which is known stable
# Full JIT in application mode can crash on some consoles/firmware versions
jit = false

[memory]
# Cap the V8 heap at 512 MB — application mode defaults to ~3 GiB but some
# consoles can't sustain that; applet mode uses ~380 MiB successfully
heap_limit = 512

[renderer]
# CPU raster is stable; GPU canvas (WebGL2) can fail on some firmware versions
canvas = cpu
